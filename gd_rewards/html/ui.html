<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ["Sora", "sans-serif"], body: ["Manrope", "sans-serif"] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Daily Rewards</title>
</head>
<body class="w-screen h-screen overflow-hidden bg-transparent font-body text-white opacity-0 pointer-events-none transition-opacity duration-200">
  <main id="app" class="mx-auto mt-[12vh] w-[min(92vw,560px)] overflow-hidden rounded-md border border-white/10 bg-[#111318]/95 shadow-2xl ring-1 ring-black/60">
    <header class="flex items-start justify-between border-b border-white/10 bg-[#191b21] px-4 py-4">
      <div class="min-w-0">
        <p class="mb-1 font-display text-[10px] font-semibold uppercase tracking-[0.22em] text-sky-400">Daily rewards</p>
        <h1 id="title" class="font-display text-lg font-semibold tracking-tight text-white">Character Rewards</h1>
        <p id="subtitle" class="mt-1 text-xs text-white/45">Claim individual rewards or collect the full daily allocation.</p>
      </div>
      <button id="closeButton" class="ml-3 shrink-0 rounded border border-white/10 bg-white/5 px-2.5 py-1.5 text-[10px] font-semibold text-white/55 transition hover:bg-white/10 hover:text-white" type="button">ESC</button>
    </header>
    <section class="px-3 py-3">
      <div class="mb-2 flex items-center justify-between px-1">
        <span class="text-[10px] font-semibold uppercase tracking-[0.18em] text-white/35">Available items</span>
        <span id="cooldown" class="text-[10px] font-semibold text-emerald-400">Ready to claim</span>
      </div>
      <div id="items" class="flex flex-col gap-1.5"></div>
      <button id="claimAllButton" class="mt-2 flex w-full items-center justify-center rounded bg-sky-500 px-3 py-2.5 text-[11px] font-bold uppercase tracking-wide text-white transition hover:bg-sky-400 disabled:cursor-not-allowed disabled:bg-white/10 disabled:text-white/30" type="button">CLAIM ALL REWARDS</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
